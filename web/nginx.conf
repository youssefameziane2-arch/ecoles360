# =============================================================================
#  Service `web` — sert les fichiers statiques de l'application
# -----------------------------------------------------------------------------
#  Ce nginx-ci ne fait QUE servir des fichiers. Le TLS, les en-têtes de
#  sécurité et le routage /api vivent dans le proxy frontal
#  (infra/nginx/conf.d/), seul service publié. Les dédoubler ici les ferait
#  diverger, et c'est la copie la moins visible qui gagnerait.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonde du HEALTHCHECK et du `depends_on: service_healthy` : une réponse
    # qui ne dépend d'aucun fichier de l'application.
    location = /sante {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # LES ASSETS PORTENT UNE EMPREINTE DANS LEUR NOM (index-BZ-vpyuA.js) : leur
    # contenu ne change jamais sous un même nom, on peut donc les figer un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'INDEX NE SE MET JAMAIS EN CACHE. C'est lui qui nomme les assets de la
    # version en service ; servi depuis un cache, un navigateur réclamerait
    # indéfiniment des fichiers effacés par le déploiement suivant.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Repli de l'application monopage : /etablissements/xyz est une route du
    # routeur, pas un fichier. Sans ce repli, un rechargement de page ou un
    # lien partagé répondrait 404 — le seul défaut que ce fichier doit éviter.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
