# =============================================================================
#  écoles360 — intégration continue
#  Lot 1 §7 · livrable 14 §3
# -----------------------------------------------------------------------------
#  « Installe, lint, build et joue les tests avec des services mysql et redis. »
#
#  Les tests s'exécutent contre une MySQL 8 et une Redis 7 RÉELLES, jamais
#  SQLite (livrable 13 §1) : les comportements qui portent le risque du produit
#  — verrous $queryRaw FOR UPDATE, ENUM natif, contraintes CHECK, FULLTEXT,
#  collation utf8mb4 — n'existent que sur le moteur de production.
#
#  PÉRIMÈTRE. Le livrable 14 §3 décrit quatre jobs : api · web · images · e2e.
#  `api`, `web` et `images` ont un objet ici. Les parcours Playwright (`e2e`)
#  attendent un staging déployé (docs/BACKLOG.md, B-10).
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    # Sans cette ligne, la condition `startsWith(github.ref, 'refs/tags/v')`
    # du job `images` ne peut jamais être vraie : un push de tag ne déclenche
    # aucune exécution, et la production (déployée sur tag vX.Y.Z, livrable 14
    # §4) n'aurait jamais d'image à tirer.
    tags: ['v*']
  pull_request:

# Une nouvelle poussée sur une branche annule l'exécution précédente : inutile
# de faire la queue derrière un état déjà périmé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, build, tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: ecoles360_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ecoles360_test
      # Base 15, réservée aux tests — jamais la base 0 (livrable 13 §2.2).
      REDIS_URL: redis://127.0.0.1:6379/15
      APP_VERSION: ${{ github.sha }}
      # Secret de session propre à l'exécution : les tests d'authentification
      # montent AppModule, dont la validation d'environnement rend cette clé
      # obligatoire (32 caractères minimum). Sans elle, la suite échouerait au
      # démarrage et non sur une assertion — un rouge dont la cause serait le
      # workflow, pas le code. Valeur jetable : elle ne protège aucune session
      # réelle ; en production le secret vit dans .env.prod (livrable 14 §6).
      SESSION_SECRET: secret-de-ci-jetable-au-moins-trente-deux-caracteres

    steps:
      - uses: actions/checkout@v4

      # Aucune clé `version` ici : la racine déclare déjà
      # `packageManager: pnpm@9.15.4`, et pnpm/action-setup v4 REFUSE de
      # démarrer si la version est donnée aux deux endroits (« Multiple
      # versions of pnpm specified »). Le champ packageManager est la bonne
      # source : il fige la version exacte, sert au corepack du Dockerfile, et
      # garantit que le poste, l image et la CI installent à l identique.
      # Le livrable 14 §3 écrit `with: { version: 9 }` : son extrait est
      # antérieur à l'ajout du champ packageManager (docs/BACKLOG.md, B-19).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter api exec prisma generate

      - name: Appliquer les migrations
        run: pnpm --filter api exec prisma migrate deploy

      # Le build précède le seed : la commande est `node dist/cli.js`, même
      # binaire que l'API avec un point d'entrée différent (livrable 14 §2).
      - name: Build (nest build — échoue si un type est cassé)
        run: pnpm --filter api build

      # AUCUN SECRET ICI, ET C'EST VOULU.
      #
      # Les `SEED_*_PASSWORD` y figuraient, repris du livrable 14 §3. Ils
      # rendaient la suite INFAILLIBLEMENT ROUGE : les tests ouvrent leurs
      # sessions avec `motdepasse-de-demonstration`, écrit en dur dans six
      # fichiers de spécification. Quelle que soit la valeur des secrets —
      # absents donc vides, ou renseignés donc différents — elle ne pouvait
      # pas coïncider avec cette constante, et chaque test qui se connecte
      # recevait un 401.
      #
      # La base de CI est jetée à la fin de chaque exécution : elle n'a aucun
      # secret à protéger. Le seeder retombe sur son mot de passe de
      # démonstration, celui-là même que les tests attendent.
      - name: Seed (référentiels + démonstration)
        run: pnpm --filter api db:seed

      - name: Lint (ESLint + Prettier)
        run: pnpm --filter api lint

      - name: Tests (Jest + Supertest, couverture)
        run: pnpm --filter api test:cov

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api
          path: api/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  #  Front — livrable 14 §3, job `web`
  # ---------------------------------------------------------------------------
  #
  #  ÉCRIT LE JOUR OÙ `web/` A CESSÉ D'ÊTRE VIDE. Le job `api` couvrait seul le
  #  dépôt tant que le front n'existait pas ; il a continué à le couvrir seul
  #  pendant que soixante-quinze fichiers de React s'y ajoutaient, sans que rien
  #  ne le signale. Une session qui n'écrirait que du front aurait vu passer une
  #  CI verte sans qu'une ligne de son travail ait été regardée.
  #
  #  NI MySQL NI REDIS ICI, et aucun test : le front n'en a pas encore. Ce que
  #  ce job prouve est modeste et vaut quand même — que le TypeScript compile et
  #  que le style tient. `pnpm --filter web build` enchaîne `tsc --noEmit` puis
  #  `vite build` : un type cassé fait échouer avant même le bundle.
  #
  #  Il ne remplace pas le regard : un écran peut compiler, passer le lint, et
  #  s'afficher de travers. La vérification visuelle reste locale
  #  (docs/SESSIONS-CLOUD.md).
  web:
    name: Web — lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Même remarque que pour `api` : la version de pnpm vient du champ
      # `packageManager` de la racine, jamais d'un `with: version`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: pnpm --filter web lint

      - name: Build (tsc --noEmit puis vite build)
        run: pnpm --filter web build

  # ---------------------------------------------------------------------------
  #  Images — livrable 14 §3, job `images`
  # ---------------------------------------------------------------------------
  #
  #  APRÈS LES TESTS, JAMAIS AVANT. `needs` fait que l'image n'existe que si
  #  ses tests sont passés : le VPS ne télécharge donc jamais un artefact qui
  #  n'a pas été éprouvé, et ne compile plus rien lui-même.
  #
  #  TAGUÉES PAR SHA, JAMAIS `latest`. Un tag mouvant ferait dériver la
  #  production en silence, et rendrait le retour arrière impossible à
  #  désigner — `deploy.sh <sha>` n'a de sens que si un SHA nomme toujours la
  #  même image (livrable 14 §4.2 et §6).
  #
  #  Seulement sur `main` et sur les tags de version : une pull request est
  #  éprouvée, pas publiée.
  images:
    name: Images — construction et publication sur ghcr.io
    needs: [api, web]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton de l'exécution, à durée de vie limitée : aucun secret
          # permanent de publication ne vit dans le dépôt (livrable 14 §3).
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le contexte est la RACINE pour les deux images : en espace de travail
      # pnpm, le fichier de verrouillage est unique et vit à la racine
      # (docs/BACKLOG.md, B-04).
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ecoles360-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ecoles360-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
