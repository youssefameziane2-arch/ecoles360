  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3848e39b-5c92-4229-87d6-0e34959e2839\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<style>/* écoles360 design system — global entry point.\n   Consumers link this single file. Keep it to @import lines only. */\n/* écoles360 — Inter webfont (self-hosted, latin subset extracted from brand maquette) */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2e2b6194-813e-4fda-b51a-f0e23f505d30\") format('woff2');\n}\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d02ac3fe-ac9c-464f-b618-262fdce9096c\") format('woff2');\n}\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4d08c29d-918c-41a2-9698-6dd1875fcf04\") format('woff2');\n}\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7098b469-319e-4a5d-9136-419349144adf\") format('woff2');\n}\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"91b7c3ae-b244-49c5-8782-d0096d851729\") format('woff2');\n}\n\n/* écoles360 — Color tokens\n   Brand rule: 60-30-10 — ~60% white, ~30% black/gray, ~10% red.\n   Red stays an accent; never used in large flat fills. */\n:root {\n  /* ---- Base palette ---- */\n\n  /* Surfaces / white-dominant */\n  --c-white:        #FFFFFF;  /* dominant surface */\n  --c-surface-soft: #F5F6F8;  /* page / section background */\n  --c-surface-mute: #F1F3F6;  /* chips, progress track, subtle fills */\n  --c-placeholder-bg: #E3E7EC; /* image placeholders */\n  --c-chart-bar:    #C9D2DE;  /* neutral data bars */\n\n  /* Ink (near-black + grays) */\n  --c-ink:          #1A1A1A;  /* primary text & dark UI (admin sidebar) */\n  --c-ink-700:      #3A424E;  /* strong body text */\n  --c-gray-600:     #5A6472;  /* secondary text */\n  --c-gray-400:     #9AA3AF;  /* muted text, captions */\n  --c-gray-300:     #AEB6C2;  /* placeholder glyphs */\n\n  /* Borders / hairlines */\n  --c-border:       #ECEEF1;  /* default card / hairline border */\n  --c-border-input: #E1E5EA;  /* form control border */\n  --c-border-soft:  #F1F3F6;  /* faint divider inside cards */\n  --c-border-strong:#D4DAE2;  /* outline buttons, stronger edge */\n\n  /* Brand red (the 10% accent) */\n  --c-red:          #E63946;  /* primary actions, active state, Sponsorisé */\n  --c-red-hover:    #D12C39;  /* hover/press darken */\n  --c-red-tint:     #FDE8EA;  /* red badge / pill background */\n\n  /* Navy (secondary accent) */\n  --c-navy:         #1D3557;  /* links, secondary buttons, dark panels */\n  --c-navy-hover:   #16293F;\n  --c-navy-tint:    #E7EDF5;  /* navy badge background */\n  --c-navy-soft:    #AFC0D6;  /* navy-panel muted text */\n\n  /* Semantic — success (green) */\n  --c-green:        #2E9E5B;  /* validations, WhatsApp, success */\n  --c-green-hover:  #268A4E;\n  --c-green-tint:   #E6F4EC;  /* success badge background */\n\n  /* Semantic — warning (amber) */\n  --c-amber:        #E9A23B;  /* alerts, low credit balance, ratings */\n  --c-amber-text:   #C2841F;  /* amber text on tint for contrast */\n  --c-amber-tint:   #FCF1DE;  /* warning badge background */\n\n  /* ---- Semantic aliases ---- */\n  --surface-page:   var(--c-surface-soft);\n  --surface-card:   var(--c-white);\n  --surface-sunken: var(--c-surface-mute);\n  --surface-dark:   var(--c-ink);\n\n  --text-strong:    var(--c-ink);\n  --text-body:      var(--c-ink-700);\n  --text-muted:     var(--c-gray-600);\n  --text-subtle:    var(--c-gray-400);\n  --text-on-dark:   var(--c-white);\n  --text-link:      var(--c-navy);\n\n  --border-card:    var(--c-border);\n  --border-field:   var(--c-border-input);\n  --border-divider: var(--c-border-soft);\n\n  --accent:         var(--c-red);\n  --accent-hover:   var(--c-red-hover);\n  --accent-tint:    var(--c-red-tint);\n\n  --success:        var(--c-green);\n  --warning:        var(--c-amber);\n  --info:           var(--c-navy);\n}\n\n/* écoles360 — Typography tokens\n   Single family (Inter). Confident, tight headings; calm, readable body.\n   Headings lean heavy (700–800) with negative tracking. */\n:root {\n  --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-family-base: var(--font-sans);\n\n  /* Weights */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-heavy:    800; /* @kind font */\n\n  /* Type scale (px) — mirrors the product maquette */\n  --fs-hero:    46px;  /* marketing H1 */\n  --fs-h1:      30px;  /* page / profile title */\n  --fs-h2:      28px;  /* section heading */\n  --fs-h3:      16px;  /* card / panel heading */\n  --fs-title:   24px;  /* dashboard title */\n  --fs-lead:    18px;  /* hero subline */\n  --fs-body:    15px;  /* default body */\n  --fs-sm:      14px;  /* dense UI text */\n  --fs-xs:      13px;  /* captions, helper */\n  --fs-2xs:     12px;  /* labels, micro */\n  --fs-eyebrow: 11px;  /* uppercase labels, badges */\n\n  /* Line heights */\n  --lh-tight:   1.1;   /* @kind font */\n  --lh-snug:    1.2;   /* @kind font */\n  --lh-normal:  1.5;   /* @kind font */\n  --lh-relaxed: 1.7;   /* @kind font */\n\n  /* Letter spacing */\n  --ls-hero:    -1px;\n  --ls-heading: -0.5px;\n  --ls-tight:   -0.6px;\n  --ls-eyebrow: 0.4px;  /* uppercase eyebrow / table head */\n  --ls-caps:    1px;    /* dark-nav section label */\n}\n\n/* écoles360 — Spacing, radius, shadow, layout tokens\n   Flat, airy aesthetic: generous spacing, rounded corners, very light shadows. */\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  28px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-14: 56px;\n  --space-16: 64px;\n  --space-20: 80px;\n\n  /* ---- Radius ---- */\n  --radius-xs:   6px;   /* badges, small chips */\n  --radius-sm:   9px;   /* table-action buttons */\n  --radius-md:   10px;  /* buttons, inputs */\n  --radius-lg:   12px;  /* nested tiles */\n  --radius-xl:   14px;  /* cards, panels */\n  --radius-2xl:  16px;  /* feature cards, search bar */\n  --radius-pill: 20px;  /* pills */\n  --radius-full: 9999px;/* avatars, circular steps */\n\n  /* ---- Shadows (light & flat — never heavy) ---- */\n  --shadow-none: none;\n  --shadow-xs:   0 1px 2px rgba(26, 26, 26, 0.04);\n  --shadow-sm:   0 6px 18px rgba(26, 26, 26, 0.06);   /* card hover lift */\n  --shadow-md:   0 8px 24px rgba(26, 26, 26, 0.08);   /* list-item hover */\n  --shadow-lg:   0 10px 28px rgba(26, 26, 26, 0.10);  /* featured card hover */\n  --shadow-float:0 8px 30px rgba(26, 26, 26, 0.10);   /* hero search bar */\n\n  /* ---- Layout ---- */\n  --container-max: 1180px;  /* public site content width */\n  --sidebar-w:     248px;   /* dashboard nav width */\n  --filter-w:      280px;   /* results filter rail */\n  --header-h:      65px;\n  --transition:    0.15s ease;  /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"4320a71d-59ee-4616-bbb5-f07d5e85ad2c\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #fff; }\n  a { color: inherit; text-decoration: none; }\n  ::placeholder { color: var(--c-gray-400); }\n  .cat:hover { border-color: var(--c-red) !important; box-shadow: var(--shadow-sm); }\n  .qa:hover { border-color: var(--c-red) !important; }\n  .soc:hover { background: var(--c-red) !important; color: #fff !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"Ecoles360App\" from=\"4fc3e59f-3e52-49ca-9d5e-89b4eb7ab8e3#/Ecoles360.app.jsx\" hint-size=\"100%,100%\"><\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
