document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

und-position: -180% 0; }\n  100% { background-position: 180% 0; }\n}\n@keyframes e360-fade-in {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}\n@keyframes e360-pop-in {\n  from { opacity: 0; transform: translateY(8px) scale(.98); }\n  to   { opacity: 1; transform: translateY(0) scale(1); }\n}\n@keyframes e360-toast-in {\n  from { opacity: 0; transform: translateX(16px); }\n  to   { opacity: 1; transform: translateX(0); }\n}\n\n/* écoles360 — Breakpoints. Mobile-first.\n   Paliers: <600 · ≥600 · ≥900 · ≥1200 · ≥1440.\n   Tables collapse to stacked cards below md (900). Phone canvas ~390, desktop ~1280. */\n:root {\n  --bp-sm: 600px;   /* large phone / small tablet */\n  --bp-md: 900px;   /* tablet — tables → cards below this */\n  --bp-lg: 1200px;  /* desktop */\n  --bp-xl: 1440px;  /* wide desktop */\n\n  --device-mobile: 390px;\n  --device-desktop: 1280px;\n  --sidebar-w: 248px;\n}\n\n<\u002Fstyle>\n<script src=\"ba39cfc4-66cd-4b20-902e-21d211b8b14d\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{font-family:'Inter',system-ui,sans-serif;color:#1A1A1A;background:#FAF8F4;-webkit-font-smoothing:antialiased;}\n  ::selection{background:#FBE0E2;}\n  a{text-decoration:none;color:inherit;}\n  .e3-link{transition:color .15s ease;}\n  .e3-link:hover{color:#E63946;}\n  .e3-navlink{position:relative;}\n  .e3-navlink:hover{color:#E63946;}\n  .e3-card{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}\n  .e3-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(26,26,26,.10);border-color:#F1C3C7 !important;}\n  .e3-btn{transition:transform .12s ease, background .15s ease, box-shadow .15s ease;cursor:pointer;}\n  .e3-btn:hover{transform:translateY(-1px);}\n  .e3-btn:active{transform:translateY(0);}\n  .e3-press{cursor:pointer;transition:all .15s ease;}\n  .e3-press:hover{background:#F4F1EB;}\n  .e3-tile{transition:all .18s ease;cursor:pointer;}\n  .e3-tile:hover{border-color:#E63946 !important;background:#FFFBFB;transform:translateY(-2px);}\n  .e3-scroll::-webkit-scrollbar{height:8px;}\n  .e3-scroll::-webkit-scrollbar-thumb{background:#DED8CE;border-radius:8px;}\n  /* Pas d'animation d'entrée bloquante : la visibilité du contenu ne doit jamais dépendre d'une animation (impression, exports, reduced-motion). */\n  @keyframes e3kenburns{from{transform:scale(1.04);}to{transform:scale(1.14);}}\n  .e3-arrow{transition:transform .15s ease;}\n  .e3-arrowwrap:hover .e3-arrow{transform:translateX(3px);}\n  input:focus,select:focus,textarea:focus{outline:none;border-color:#E63946 !important;box-shadow:0 0 0 3px rgba(230,57,70,.12);}\n\n  /* ---------- Responsive layer ---------- */\n  .e3-burger{display:none;}\n  .e3-drawer{display:none;}\n  .e3-tabbar{display:none;}\n  @keyframes e3shimmer{0%{background-position:-360px 0;}100%{background-position:360px 0;}}\n  .e3-shimmer{background:#ECEEF1;background-image:linear-gradient(90deg,#ECEEF1 0px,#F5F6F8 160px,#ECEEF1 320px);background-size:720px 100%;animation:e3shimmer 1.2s linear infinite;}\n  @media (max-width:1040px){ .e3-reslayout{grid-template-columns:1fr !important;} .e3-mapcol{display:none !important;} }\n\n  /* ============ RESPONSIVE (inline styles serialize WITH spaces) ============ */\n  @media (max-width:980px){\n    .e3-desknav{display:none !important;}\n    .e3-headcta{display:none !important;}\n    .e3-burger{display:flex !important;}\n    .e3-deskheader{display:none !important;}\n    .e3-mobheader{display:flex !important;}\n    /* 4-up → 2-up, 6-up → 3-up */\n    [style*=\"repeat(6, 1fr)\"]{grid-template-columns:repeat(3, 1fr) !important;}\n    [style*=\"repeat(4, 1fr)\"]{grid-template-columns:repeat(2, 1fr) !important;}\n    /* asymmetric two-col layouts stack */\n    [style*=\"1fr 360px\"]{grid-template-columns:1fr !important;}\n    [style*=\"1.1fr .9fr\"]{grid-template-columns:1fr !important;}\n    [style*=\"1.6fr 1fr 1fr 1fr\"]{grid-template-columns:1fr 1fr !important;}\n    /* shrink big inner paddings */\n    [style*=\"padding: 38px 48px\"]{padding:28px 22px !important;}\n    [style*=\"padding: 40px 48px\"]{padding:28px 22px !important;}\n    [style*=\"padding: 44px 48px\"]{padding:28px 22px !important;}\n    [style*=\"padding: 56px 60px\"]{padding:32px 24px !important;}\n    [style*=\"padding: 72px 32px\"]{padding:44px 22px !important;}\n  }\n  @media (max-width:640px){\n    .e3-tabbar{display:flex !important;}\n    .e3-root{padding-bottom:66px !important;}\n    /* page gutters */\n    [style*=\"padding: 0px 32px\"]{padding-left:18px !important;padding-right:18px !important;}\n    /* everything to a single column */\n    [style*=\"repeat(6, 1fr)\"]{grid-template-columns:repeat(2, 1fr) !important;}\n    [style*=\"repeat(3, 1fr)\"]{grid-template-columns:1fr !important;}\n    [style*=\"repeat(2, 1fr)\"]{grid-template-columns:1fr !important;}\n    [style*=\"1.6fr 1fr 1fr 1fr\"]{grid-template-columns:1fr !important;}\n    .e3-simgrid{grid-template-columns:1fr !important;}\n    /* hero type scales down */\n    [style*=\"font-size: 44px\"]{font-size:clamp(27px,8vw,38px) !important;}\n    [style*=\"font-size: 40px\"]{font-size:clamp(26px,8vw,36px) !important;}\n    [style*=\"font-size: 34px\"]{font-size:clamp(23px,6vw,30px) !important;}\n    [style*=\"font-size: 32px\"]{font-size:clamp(22px,6vw,29px) !important;}\n    /* search row + hero search card stack */\n    .e3-searchrow{flex-direction:column !important;}\n    .e3-typegrid{grid-template-columns:repeat(3, 1fr) !important;}\n    [style*=\"margin: -72px auto 0\"]{margin-top:-44px !important;}\n    /* filter bar wraps & scrolls comfortably */\n    .e3-filtertypes{flex-wrap:nowrap !important;overflow-x:auto !important;-webkit-overflow-scrolling:touch;padding-bottom:4px;}\n    .e3-filterctrls{flex-wrap:wrap !important;}\n\n    /* ---- Refonte accueil mobile ---- */\n    .e3-hero{height:auto !important;min-height:0 !important;}\n    .e3-herocontent{height:auto !important;padding:72px 18px 58px !important;}\n    .e3-hero [style*=\"font-size: 19px\"]{font-size:15.5px !important;}\n    .e3-searchsec{padding:0 14px !important;}\n    .e3-searchcard{padding:18px 16px 16px !important;border-radius:16px !important;}\n    .e3-searchrow{align-items:stretch !important;gap:10px !important;margin-top:14px !important;}\n    .e3-searchrow button{width:100% !important;justify-content:center !important;min-height:48px;}\n    .e3-truststats{grid-template-columns:repeat(2, 1fr) !important;gap:22px 18px !important;padding:26px 22px !important;border-radius:16px !important;}\n    .e3-truststats > div{border-left:none !important;padding-left:0 !important;}\n    .e3-featgrid{grid-template-columns:1fr !important;gap:16px !important;}\n    .e3-sechead{flex-wrap:wrap !important;gap:8px 14px !important;margin-bottom:18px !important;}\n    .e3-reviewrow{gap:10px !important;}\n    .e3-reviewrow > .e3-btn{width:40px !important;height:40px !important;}\n    .e3-reviewcard{padding:24px 16px !important;min-height:0 !important;}\n    .e3-reviewcard p{font-size:16px !important;}\n    .e3-ctapanel{flex-direction:column !important;align-items:flex-start !important;gap:22px !important;padding:32px 24px !important;}\n    .e3-helpbtns{flex-wrap:wrap !important;width:100%;}\n    .e3-helpbtns > button{flex:1 1 auto;justify-content:center;min-height:48px;}\n    [style*=\"margin: 64px auto\"]{margin-top:40px !important;}\n    [style*=\"margin: 72px auto\"]{margin-top:44px !important;}\n    [style*=\"margin: 80px auto\"]{margin-top:48px !important;}\n    [style*=\"margin-top: 80px\"]{margin-top:48px !important;}\n    [style*=\"padding: 72px 0px\"]{padding-top:44px !important;padding-bottom:44px !important;}\n    [style*=\"font-size: 30px\"]{font-size:clamp(22px,6vw,27px) !important;}\n    /* type picker compact */\n    .e3-typetile{min-height:100px !important;padding:16px 8px !important;gap:9px !important;}\n    .e3-typetile-ic{width:46px !important;height:46px !important;}\n    .e3-typegrid button{min-height:60px -content:center !important;}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"e3-root\" style=\"min-height:100vh;display:flex;flex-direction:column;background:#FAF8F4;\">\n\n  <sc-if value=\"{{ showHeader }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:sticky;top:0;z-index:50;\">\n    <div class=\"e3-deskheader\" style=\"background:#fff;border-bottom:1px solid var(--border-hairline,#EAE6DE);\">\n      <header style=\"display:flex;align-items:center;gap:30px;height:66px;max-width:1180px;margin:0 auto;padding:0 32px;\">\n        <img sc-camel-on-click=\"{{ goHome }}\" src=\"75d0926b-461f-4ddf-aafd-94383f19d2af\" alt=\"écoles360\" style=\"height:28px;width:auto;cursor:pointer;flex:none;\">\n        <nav sc-camel-on-click=\"{{ onHeaderNav }}\" style=\"display:flex;gap:26px;align-items:center;height:100%;\">\n          <sc-for list=\"{{ navLinks }}\" as=\"it\" hint-placeholder-count=\"5\">\n            <a href=\"{{ it.href }}\" style=\"display:inline-flex;align-items:center;height:100%;font-family:var(--font-sans,'Inter',sans-serif);font-size:15px;font-weight:{{ it.weight }};color:{{ it.color }};text-decoration:none;box-shadow:{{ it.shadow }};\">{{ it.label }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fnav>\n        <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;\">\n          <sc-if value=\"{{ parentLoggedOut }}\" hint-placeholder-val=\"{{ true }}\">\n            <x-import component-from-global-scope=\"Coles360DesignSystem_66e6db.Button\" variant=\"outline\" on-click=\"{{ goLogin }}\" hint-size=\"auto,42px\">Connexion<\u002Fx-import>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ parentAuth }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:relative;\">\n              <button class=\"e3-btn\" sc-camel-on-click=\"{{ toggleParentMenu }}\" aria-label=\"Mon compte\" style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none 700;\">{{ art_author }}<\u002Fdiv><div style=\"font-size:13px;color:#9AA3AF;\">{{ art_date }} · {{ art_read }} de lecture<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"max-width:920px;margin:32px auto 0;padding:0 32px;\">\n          <div style=\"height:420px;border-radius:18px;overflow:hidden;background:#E3E7EC;background-image:url('{{ art_cover }}');background-size:cover;background-position:center;\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <article style=\"max-width:720px;margin:40px auto 0;padding:0 32px;\">\n          <p style=\"margin:0 0 22px;font-size:18px;line-height:1.7;color:#1A1A1A;font-weight:500;\">Choisir un établissement scolaire est l'une des décisions les plus importantes pour l'avenir d'un enfant. Entre la pédagogie, la distance, le budget et les valeurs, il est facile de se sentir dépassé. Voici comment y voir clair.<\u002Fp>\n          <p style=\"margin:0 0 22px;font-size:16px;line-height:1.8;color:#3A424E;\">Avant même de comparer les écoles, prenez le temps de définir vos priorités en famille. Un établissement excellent sur le papier ne sera pas forcément le bon pour votre enfant si le projet pédagogique ne correspond pas à sa personnalité et à votre rythme de vie.<\u002Fp>\n          <h2 style=\"margin:36px 0 14px;font-size:24px;font-weight:800;letter-spacing:-0.5px;\">1. Le projet pédagogique avant tout<\u002Fh2>\n          <p style=\"margin:0 0 22px;font-size:16px;line-height:1.8;color:#3A424E;\">Méthode classique, Montessori, bilingue, mission française : chaque approche a ses forces. Renseignez-vous sur la façon dont l'école accompagne les élèves en difficulté comme les plus avancés, et sur la place laissée aux langues et aux activités parascolaires.<\u002Fp>\n          <blockquote style=\"margin:32px 0;padding:22px 28px;background:#FBFAF7;border-left:4px solid #E63946;border-radius:0 12px 12px 0;font-size:19px;font-style:italic;line-height:1.6;color:#1A1A1A;\">« Le meilleur établissement n'est pas le plus prestigieux, mais celui où votre enfant a envie d'aller chaque matin. »<\u002Fblockquote>\n          <h2 style=\"margin:36px 0 14px;font-size:24px;font-weight:800;letter-spacing:-0.5px;\">2. La distance et le rythme quotidien<\u002Fh2>\n          <p style=\"margin:0 0 22px;font-size:16px;line-height:1.8;color:#3A424E;\">Un trajet trop long pèse vite sur la fatigue et l'organisation familiale. Vérifiez les options de transport scolaire et la compatibilité des horaires avec votre emploi du temps avant de vous engager.<\u002Fp>\n          <h2 style=\"margin:36px 0 14px;font-size:24px;font-weight:800;letter-spacing:-0.5px;\">3. Le budget, en toute transparence<\u002Fh2>\n          <p style=\"margin:0 0 28px;font-size:16px;line-height:1.8;color:#3A424E;\">Au-delà des mensualités, pensez aux frais d'inscription, aux fournitures, à la cantine et aux activités. Sur écoles360, chaque fiche affiche une gamme indicative pour vous aider à situer un établissement, et vous pouvez contacter l'école directement pour le détail.<\u002Fp>\n\n          <div style=\"display:flex;align-items:center;gap:14px;padding:22px 0;border-top:1px solid #EAE6DE;border-bottom:1px solid #EAE6DE;margin-bottom:48px;\">\n            <span style=\"font-size:14px;font-weight:600;color:#5A6472;\">Partager :<\u002Fspan>\n            <div style=\"display:flex;gap:9px;\">\n              <sc-for list=\"{{ artShare }}\" as=\"s\" hint-placeholder-count=\"3\"><div class=\"e3-press\" style=\"width:40px;height:40px;border-radius:10px;background:#1D3557;display:flex;align-items:center;justify-content:center;cursor:pointer;\">{{ s.icon }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <section style=\"max-width:1180px;margin:0 auto;padding:0 32px 90px;\">\n          <h2 style=\"margin:0 0 22px;font-size:24px;font-weight:800;letter-spacing:-0.5px;\">À lire aussi<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;\">\n            <sc-for list=\"{{ artRelated }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ a.onClick }}\" class=\"e3-card\" style=\"cursor:pointer;background:#fff;border:1px solid #EAE6DE;border-radius:16px;overflow:hidden;\">\n                <div style=\"height:160px;background:#E3E7EC;background-image:url('{{ a.img }}');background-size:cover;background-position:center;\"><\u002Fdiv>\n                <div style=\"padding:18px;display:flex;flex-direction:column;gap:9px;\">\n                  <span style=\"align-self:flex-start;background:#F1F3F6;color:#5A6472;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;\">{{ a.cat }}<\u002Fspan>\n                  <h3 style=\"margin:0;font-size:16.5px;font-weight:700;letter-spacing:-0.3px;line-height:1.3;\">{{ a.title }}<\u002Fh3>\n                  <div style=\"font-size:12.5px;color:#9AA3AF;\">{{ a.date }} · {{ a.read }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isArticle }}\" hint-placeholder-val=\"{{ false }}\"><div id=\"screen-article\"><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"e3-in\">\n        <section style=\"max-width:820px;margin:0 auto;padding:64px 32px 0;text-align:center;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#E63946;margin-bottom:12px;\">Notre mission<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:42px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;\">Aider chaque famille à trouver la bonne école, en toute confiance<\u002Fh1>\n          <p style=\"margin:18px auto 0;font-size:18px;line-height:1.6;color:#5A6472;max-width:600px;\">écoles360 rassemble, vérifie et présente les établissements scolaires privés du Maroc pour que choisir devienne simple, clair et serein.<\u002Fp>\n        <\u002Fsection>\n\n        <section style=\"max-width:1180px;margin:64px auto 0;padding:0 32px;\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;\">\n            <div>\n              <h2 style=\"margin:0 0 16px;font-size:30px;font-weight:800;letter-spacing:-0.7px;\">Notre histoire<\u002Fh2>\n              <p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.75;color:#3A424E;\">{{ aboutHistoire }}<\u002Fp>\n              <p style=\"margin:0;font-size:15.5px;line-height:1.75;color:#3A424E;\">Aujourd'hui, la plateforme référence plus de 1 200 établissements dans 24 villes, et accompagne chaque mois des dizaines de milliers de familles dans l'une des décisions les plus importantes de leur vie.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"height:340px;border-radius:18px;overflow:hidden;background:#E3E7EC;background-image:url('{{ aboutHistoryImg }}');background-size:cover;background-position:center;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"max-width:1180px;margin:72px auto 0;padding:0 32px;\">\n          <div style=\"background:#1D3557;border-radius:20px;padding:40px 48px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;\">\n            <sc-for list=\"{{ trustStats }}\" as=\"st\" hint-placeholder-count=\"4\">\n              <div style=\"border-left:2px solid rgba(255,255,255,.14);padding-left:22px;\">\n                <div style=\"font-size:34px;font-weight:800;letter-spacing:-1px;color:#fff;\">{{ st.value }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#AFC0D6;margin-top:6px;\">{{ st.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"max-width:1180px;margin:72px auto 0;padding:0 32px;\">\n          <div style=\"text-align:center;margin-bottom:40px;\">\n            <div s
