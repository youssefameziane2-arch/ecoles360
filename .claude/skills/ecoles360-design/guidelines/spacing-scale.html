<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base unit" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
  .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .it{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .bar{background:var(--action);border-radius:3px;height:22px}
  .n{font:var(--fw-semibold) var(--fs-xs)/1 var(--font-sans);color:var(--text-primary)}
  .px{font:var(--fw-regular) 10px/1 var(--font-sans);color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="it"><div class="bar" style="width:4px"></div><span class="n">1</span><span class="px">4px</span></div>
    <div class="it"><div class="bar" style="width:8px"></div><span class="n">2</span><span class="px">8px</span></div>
    <div class="it"><div class="bar" style="width:12px"></div><span class="n">3</span><span class="px">12px</span></div>
    <div class="it"><div class="bar" style="width:16px"></div><span class="n">4</span><span class="px">16px</span></div>
    <div class="it"><div class="bar" style="width:20px"></div><span class="n">5</span><span class="px">20px</span></div>
    <div class="it"><div class="bar" style="width:24px"></div><span class="n">6</span><span class="px">24px</span></div>
    <div class="it"><div class="bar" style="width:32px"></div><span class="n">8</span><span class="px">32px</span></div>
    <div class="it"><div class="bar" style="width:40px"></div><span class="n">10</span><span class="px">40px</span></div>
    <div class="it"><div class="bar" style="width:48px"></div><span class="n">12</span><span class="px">48px</span></div>
    <div class="it"><div class="bar" style="width:64px"></div><span class="n">16</span><span class="px">64px</span></div>
  </div>
</body></html>
