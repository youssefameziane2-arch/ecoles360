<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;height:180px}
  .cell{display:flex;align-items:center;justify-content:center;position:relative}
  .light{background:#fff;border-right:1px solid var(--border-hairline)}
  .dark{background:var(--surface-dark)}
  img{height:54px;width:auto}
  .tag{position:absolute;left:14px;bottom:12px;font:var(--fw-medium) 10px/1 var(--font-sans);letter-spacing:.4px;text-transform:uppercase}
</style></head>
<body>
  <div class="grid">
    <div class="cell light"><img src="../assets/logo.png" alt="écoles360 — Annuaires Maroc"><span class="tag" style="color:var(--text-muted)">Sur fond clair</span></div>
    <div class="cell dark"><img src="../assets/logo-on-dark.png" alt="écoles360 — Annuaires Maroc"><span class="tag" style="color:var(--e360-navy-faint)">Sur fond sombre</span></div>
  </div>
</body></html>
