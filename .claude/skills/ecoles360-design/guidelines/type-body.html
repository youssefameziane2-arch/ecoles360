<!-- @dsCard group="Type" viewport="700x210" name="Body & UI" subtitle="Lead → body → meta → caption" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;color:var(--text-primary)}
  .line{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid var(--border-hairline)}
  .tag{flex:none;width:118px;font:var(--fw-medium) var(--fs-xs)/1 var(--font-sans);color:var(--text-muted)}
</style></head>
<body>
  <div class="line"><span class="tag">Lead · 15 / 400</span><span style="font-size:var(--fs-body-lg);color:var(--text-body)">Comparez les établissements près de chez vous.</span></div>
  <div class="line"><span class="tag">Body · 14 / 400</span><span style="font-size:var(--fs-body);color:var(--text-body)">Encadrement remarquable, communication fluide avec les enseignants.</span></div>
  <div class="line"><span class="tag">Small · 13 / 500</span><span style="font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--text-secondary)">Casablanca · Lycée · ★ 4,8</span></div>
  <div class="line"><span class="tag">Meta · 12 / 400</span><span style="font-size:var(--fs-xs);color:var(--text-muted)">Mis à jour il y a 2 jours</span></div>
  <div class="line"><span class="tag">Eyebrow · 11 / 700</span><span style="font-size:var(--fs-eyebrow);font-weight:var(--fw-bold);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--action)">En toute confiance</span></div>
</body></html>
