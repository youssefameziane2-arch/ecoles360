<!-- @dsCard group="Brand" viewport="700x160" name="60 · 30 · 10 rule" subtitle="White dominant · navy structure · red accent only" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
  .bar{display:flex;height:62px;border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--border-hairline)}
  .seg{display:flex;align-items:center;justify-content:center;font:var(--fw-bold) var(--fs-sm)/1 var(--font-sans)}
  .legend{display:flex;gap:24px;margin-top:14px;flex-wrap:wrap}
  .li{display:flex;align-items:center;gap:8px;font:var(--fw-regular) var(--fs-xs)/1.4 var(--font-sans);color:var(--text-secondary)}
  .dot{width:12px;height:12px;border-radius:3px}
</style></head>
<body>
  <div class="bar">
    <div class="seg" style="flex:60;background:#fff;color:var(--text-secondary)">60% Blanc</div>
    <div class="seg" style="flex:30;background:var(--e360-navy);color:#fff">30% Navy</div>
    <div class="seg" style="flex:10;background:var(--e360-red);color:#fff">10%</div>
  </div>
  <div class="legend">
    <div class="li"><span class="dot" style="background:#fff;border:1px solid var(--border-strong)"></span>Blanc dominant — surfaces, respiration</div>
    <div class="li"><span class="dot" style="background:var(--e360-navy)"></span>Navy — structure, sidebar, panneaux</div>
    <div class="li"><span class="dot" style="background:var(--e360-red)"></span>Rouge — action / actif uniquement</div>
  </div>
</body></html>
