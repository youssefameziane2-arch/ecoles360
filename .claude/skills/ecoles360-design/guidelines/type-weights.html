<!-- @dsCard group="Type" viewport="700x150" name="Weights & numerals" subtitle="Inter 400–800 · KPI numerals" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;color:var(--text-primary);display:flex;gap:34px;align-items:center;flex-wrap:wrap}
  .w{display:flex;flex-direction:column;gap:3px}
  .ws{font-size:26px;letter-spacing:-.4px}
  .wl{font:var(--fw-medium) var(--fs-xs)/1 var(--font-sans);color:var(--text-muted)}
  .kpi{display:flex;flex-direction:column;gap:2px;padding-left:30px;border-left:1px solid var(--border-hairline)}
</style></head>
<body>
  <div class="w"><span class="ws" style="font-weight:400">Aa</span><span class="wl">Regular 400</span></div>
  <div class="w"><span class="ws" style="font-weight:500">Aa</span><span class="wl">Medium 500</span></div>
  <div class="w"><span class="ws" style="font-weight:600">Aa</span><span class="wl">Semibold 600</span></div>
  <div class="w"><span class="ws" style="font-weight:700">Aa</span><span class="wl">Bold 700</span></div>
  <div class="w"><span class="ws" style="font-weight:800">Aa</span><span class="wl">Extrabold 800</span></div>
  <div class="kpi"><span style="font:var(--fw-extrabold) var(--fs-stat-lg)/1 var(--font-sans);letter-spacing:-1px">8 420</span><span class="wl">KPI · 40 / 800 — virgule décimale 4,8</span></div>
</body></html>
