<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Green success/WhatsApp · amber stars/alerts" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:18px}
  .row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .sw{border-radius:var(--radius-card);overflow:hidden;border:1px solid var(--border-hairline)}
  .chip{height:74px}
  .meta{padding:9px 11px}
  .name{font:var(--fw-semibold) var(--fs-sm)/1.2 var(--font-sans);color:var(--text-primary)}
  .hex{font:var(--fw-medium) var(--fs-xs)/1.4 var(--font-sans);color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
  .role{font:var(--fw-regular) var(--fs-xs)/1.4 var(--font-sans);color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--e360-green)"></div><div class="meta"><div class="name">Vert — succès</div><div class="hex">#2E9E5B</div><div class="role">WhatsApp · vérifié · succès</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--e360-amber)"></div><div class="meta"><div class="name">Ambre — alerte</div><div class="hex">#E9A23B</div><div class="role">Étoiles ★ · avertissements</div></div></div>
  </div>
</body></html>
