<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--text-primary); padding: 22px; }
  .grp { font: var(--fw-bold) var(--fs-2xs)/1 var(--font-sans); letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 11px; }
  .row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-bottom: 22px; }
  .block { margin-bottom: 22px; max-width: 420px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Badge, Tag, Avatar, ProgressBar, PermissionToggle, Pagination, DataTable } = window.Coles360DesignSystem_66e6db;
  function Demo() {
    const [page, setPage] = React.useState(2);
    return (
      <div>
        <div className="grp">Badges — statuts</div>
        <div className="row">
          <Badge tone="red">Sponsorisé</Badge>
          <Badge tone="green" icon="✓">Vérifié</Badge>
          <Badge tone="navy" solid>Nouveau</Badge>
          <Badge tone="amber" dot>En cours</Badge>
          <Badge tone="grey">Traité</Badge>
          <Badge tone="amber">Solde bas</Badge>
        </div>
        <div className="grp">Tags — filières</div>
        <div className="row">
          <Tag>Bilingue</Tag>
          <Tag active>Sciences</Tag>
          <Tag>Internat</Tag>
          <Tag removable>Lycée</Tag>
        </div>
        <div className="grp">Avatars</div>
        <div className="row">
          <Avatar name="Sara Bennani" />
          <Avatar name="Youssef Alaoui" />
          <Avatar name="Groupe Al Massira" />
          <Avatar name="Imane Tazi" size={52} />
        </div>
        <div className="grp">Jauge de crédits · Permission</div>
        <div className="block">
          <ProgressBar label="Solde de crédits" value={320} max={500} showValue tone="red" />
          <div style={{height:14}}></div>
          <PermissionToggle label="Répondre aux avis" description="Publier des réponses publiques" defaultChecked />
        </div>
        <div className="grp">DataTable → Pagination</div>
        <DataTable
          columns={[
            { key: 'niveau', header: 'Niveau' },
            { key: 'frais', header: 'Frais / an', align: 'right' },
            { key: 'statut', header: 'Statut', render: r => <Badge tone={r.tone}>{r.statut}</Badge> },
          ]}
          rows={[
            { niveau: 'Primaire', frais: '18 000 MAD', statut: 'Vérifié', tone: 'green' },
            { niveau: 'Collège', frais: '22 000 MAD', statut: 'En attente', tone: 'amber' },
            { niveau: 'Lycée', frais: '24 000 MAD', statut: 'Vérifié', tone: 'green' },
          ]}
        />
        <div style={{height:14}}></div>
        <Pagination page={page} pageCount={8} onChange={setPage} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
