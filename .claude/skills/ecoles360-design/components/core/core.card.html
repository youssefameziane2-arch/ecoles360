<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;color:var(--text-primary);padding:22px}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
  .it{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--border-hairline);border-radius:var(--radius-control);color:var(--text-secondary)}
  .lbl{font:var(--fw-regular) 9px/1.1 var(--font-sans);color:var(--text-muted);text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Icon, ICONS } = window.Coles360DesignSystem_66e6db;
  function Demo(){
    return (
      <div className="grid">
        {Object.keys(ICONS).map(n => (
          <div className="it" key={n}>
            <Icon name={n} size={22} />
            <span className="lbl">{n}</span>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
