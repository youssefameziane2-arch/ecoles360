<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); padding: 22px; }
  .grp { font: var(--fw-bold) var(--fs-2xs)/1 var(--font-sans); letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 11px; }
  .sec { margin-bottom: 24px; }
  .panel { background: #fff; border: 1px solid var(--border-hairline); border-radius: var(--radius-card-lg); padding: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { TypePicker, CitySelect, FilterBar } = window.Coles360DesignSystem_66e6db;
  function Demo() {
    const [types, setTypes] = React.useState(['lycee']);
    const [city, setCity] = React.useState('Casablanca');
    const [filters, setFilters] = React.useState([
      { key:'type', label:'Type' },
      { key:'filiere', label:'Filière' },
      { key:'budget', label:'Budget : 800–3 000 MAD', active:true },
      { key:'note', label:'★ 4+', active:true },
    ]);
    const toggle = (k) => setFilters(fs => fs.map(f => f.key === k ? {...f, active: !f.active} : f));
    return (
      <div>
        <div className="sec">
          <div className="grp">TypePicker — type d'établissement</div>
          <TypePicker value={types} onChange={setTypes} />
        </div>
        <div className="sec" style={{maxWidth:320}}>
          <div className="grp">CitySelect — obligatoire</div>
          <CitySelect value={city} onChange={e=>setCity(e.target.value)} />
        </div>
        <div className="sec">
          <div className="grp">FilterBar — résultats</div>
          <div className="panel">
            <FilterBar filters={filters} onToggle={toggle} onApply={()=>{}} onReset={()=>setFilters(fs=>fs.map(f=>({...f,active:false})))} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
