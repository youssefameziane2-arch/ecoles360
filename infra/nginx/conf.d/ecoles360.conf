# =============================================================================
#  écoles360 — proxy frontal de production
#  Livrable 14 §2 et §6
# -----------------------------------------------------------------------------
#  SEUL SERVICE PUBLIÉ (80 et 443). api, web, mysql et redis ne sont joignables
#  que sur le réseau interne `ecoles360_net`.
#
#  /api → api:3000 · tout le reste → web:80. MÊME ORIGINE, DONC PAS DE CORS :
#  c'est ce qui permet au cookie de session d'être SameSite=Lax plutôt que
#  None, et à l'API de refuser toute requête d'une autre origine (livrable 14
#  §6).
#
#  LES CERTIFICATS N'EXISTENT PAS AU PREMIER DÉMARRAGE, et nginx refuse de se
#  lancer si un `ssl_certificate` pointe dans le vide. Le bloc 443 est donc
#  précédé du bloc 80, qui sert seul le défi ACME. Ordre d'amorçage dans
#  infra/README-DEPLOIEMENT.md — ne pas inverser.
# =============================================================================

# -----------------------------------------------------------------------------
#  80 — défi ACME, puis redirection
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ecoles360.com www.ecoles360.com;

    # Certbot dépose ici son jeton de validation. CETTE LOCATION PASSE AVANT
    # LA REDIRECTION : renvoyée en 301 vers https, la validation échouerait, et
    # le renouvellement automatique casserait au bout de quatre-vingt-dix jours
    # — une panne qui se déclare un dimanche, trois mois après la mise en
    # service.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
#  443 — le site
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ecoles360.com www.ecoles360.com;

    ssl_certificate     /etc/letsencrypt/live/ecoles360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoles360.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — un an, sous-domaines compris (livrable 14 §6).
    # À N'ACTIVER QU'UNE FOIS LE TLS ÉPROUVÉ : un navigateur qui a reçu cet
    # en-tête refusera tout accès en clair au domaine pendant un an, y compris
    # si le certificat vient à manquer. Il n'y a pas de marche arrière côté
    # visiteur.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Les photos des fiches sont servies par l'API depuis le volume `storage`,
    # et certaines pèsent plusieurs mégaoctets à l'envoi (RG16).
    client_max_body_size 12m;

    # ---------------------------------------------------------------------
    #  API
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # SANS CET EN-TÊTE, TOUTES LES REQUÊTES VIENNENT DE L'ADRESSE DU PROXY.
        # La limitation de débit de l'API est par IP — avis et demandes à cinq
        # par heure (livrable 14 §6) : elle plafonnerait le site entier au
        # quota d'un seul visiteur.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # L'API pose ses cookies `Secure` : elle doit savoir que l'échange est
        # chiffré, ce que le saut interne en clair ne lui dit pas.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    #  Site et back-offices
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
